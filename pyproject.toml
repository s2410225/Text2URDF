[project]
name = "urdfgen"
version = "0.1.0"
description = "Assemble URDF robot descriptions from a pre-designed module catalog"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "yourdfpy>=0.0.56",
    "trimesh>=4.0",
    # The assembly layer talks to a local OpenAI-compatible server over plain
    # HTTP; no vendor SDK is involved.
    "httpx>=0.27",
    # PNG previews. 10.1 is where load_default() became scalable, which is what
    # lets captions render without depending on a system font path.
    "pillow>=10.1",
]

[project.scripts]
urdfgen = "urdfgen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urdfgen"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yourdfpy.*", "trimesh.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that call a live LLM API (deselected by default)",
]
addopts = "-m 'not integration'"
