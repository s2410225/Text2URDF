id: arm_3dof_v1
version: 1.0.0
display_name: 3-DOF manipulator arm
category: arm
description: >
  Shoulder yaw, shoulder pitch and elbow pitch. Mounts on any TOOL_M20 flange
  and exposes a TOOL_M20 socket at the wrist for an end effector.
tags: [manipulator, 3dof]

root_link: arm_base

links:
  - name: arm_base
    material: aluminum
    visual:
      geometry: {shape: cylinder, radius: 0.045, length: 0.06}
      origin: {xyz: [0, 0, 0.03], rpy: [0, 0, 0]}
    collision:
      geometry: {shape: cylinder, radius: 0.045, length: 0.06}
      origin: {xyz: [0, 0, 0.03], rpy: [0, 0, 0]}
    inertial:
      mass: 0.55
      origin: {xyz: [0, 0, 0.03], rpy: [0, 0, 0]}
      inertia: {ixx: 0.0004434375, iyy: 0.0004434375, izz: 0.000556875,
                ixy: 0.0, ixz: 0.0, iyz: 0.0}

  - name: shoulder
    material: steel
    visual:
      geometry: {shape: box, size: [0.06, 0.08, 0.05]}
      origin: {xyz: [0, 0, 0.025], rpy: [0, 0, 0]}
    collision:
      geometry: {shape: box, size: [0.06, 0.08, 0.05]}
      origin: {xyz: [0, 0, 0.025], rpy: [0, 0, 0]}
    inertial:
      mass: 0.30
      origin: {xyz: [0, 0, 0.025], rpy: [0, 0, 0]}
      inertia: {ixx: 0.0002225, iyy: 0.0001525, izz: 0.00025,
                ixy: 0.0, ixz: 0.0, iyz: 0.0}

  - name: upper_arm
    material: accent_orange
    visual:
      geometry: {shape: cylinder, radius: 0.03, length: 0.20}
      origin: {xyz: [0, 0, 0.10], rpy: [0, 0, 0]}
    collision:
      geometry: {shape: cylinder, radius: 0.03, length: 0.20}
      origin: {xyz: [0, 0, 0.10], rpy: [0, 0, 0]}
    inertial:
      mass: 0.62
      origin: {xyz: [0, 0, 0.10], rpy: [0, 0, 0]}
      inertia: {ixx: 0.0022061667, iyy: 0.0022061667, izz: 0.000279,
                ixy: 0.0, ixz: 0.0, iyz: 0.0}

  - name: forearm
    material: polymer_black
    visual:
      geometry: {shape: cylinder, radius: 0.025, length: 0.18}
      origin: {xyz: [0, 0, 0.09], rpy: [0, 0, 0]}
    collision:
      geometry: {shape: cylinder, radius: 0.025, length: 0.18}
      origin: {xyz: [0, 0, 0.09], rpy: [0, 0, 0]}
    inertial:
      mass: 0.41
      origin: {xyz: [0, 0, 0.09], rpy: [0, 0, 0]}
      inertia: {ixx: 0.0011710625, iyy: 0.0011710625, izz: 0.000128125,
                ixy: 0.0, ixz: 0.0, iyz: 0.0}

joints:
  - name: shoulder_yaw
    type: revolute
    parent: arm_base
    child: shoulder
    origin: {xyz: [0, 0, 0.06], rpy: [0, 0, 0]}
    axis: [0, 0, 1]
    limit: {lower: -3.14, upper: 3.14, effort: 18.0, velocity: 6.0}

  - name: shoulder_pitch
    type: revolute
    parent: shoulder
    child: upper_arm
    origin: {xyz: [0, 0, 0.05], rpy: [0, 0, 0]}
    axis: [0, 1, 0]
    limit: {lower: -1.57, upper: 1.57, effort: 18.0, velocity: 6.0}

  - name: elbow_pitch
    type: revolute
    parent: upper_arm
    child: forearm
    origin: {xyz: [0, 0, 0.20], rpy: [0, 0, 0]}
    axis: [0, 1, 0]
    limit: {lower: -2.44, upper: 0.0, effort: 12.0, velocity: 6.0}

ports:
  - name: base
    role: male
    interface: TOOL_M20
    link: arm_base
    origin: {xyz: [0, 0, 0], rpy: [0, 0, 0]}
    description: Mounts onto a chassis payload flange.
  - name: tool
    role: female
    interface: TOOL_M20
    link: forearm
    origin: {xyz: [0, 0, 0.18], rpy: [0, 0, 0]}
    description: Wrist flange, receives an end effector.
